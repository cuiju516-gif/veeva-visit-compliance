<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="医药代表学术拜访合规系统：服务端时间戳、GPS 证据与合规拜访记录。">
  <title>学术拜访合规</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <aside class="identity-rail" aria-label="切换身份">
    <div class="rail-head">演示身份</div>
    <div class="rail-list" id="identity-list"></div>
  </aside>

  <header class="app-header">
    <div class="app-header-inner">
      <div>
        <h1>学术拜访合规</h1>
        <p class="subtitle">计划、证明并记录每一次拜访 —— 时间由服务端盖章，位置可核验。</p>
      </div>
      <div class="header-actions">
        <span class="actor-note" id="actor-note"></span>
        <button class="btn btn-small" type="button" id="refresh" data-testid="refresh-all">刷新</button>
      </div>
    </div>
  </header>

  <main class="layout" id="main">
    <div class="column-left">
      <div id="plan-root"></div>
      <div id="list-root"></div>
    </div>

    <div class="column-right" id="detail-root"></div>

    <div class="rules-region" id="rules-root"></div>

    <div class="dashboard-region" id="dashboard-root"></div>
  </main>

  <noscript>
    <p class="noscript">本应用需要启用 JavaScript。</p>
  </noscript>
</body>
</html>
